name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make image
      - name: Image answers
        run: |
          docker run -d --name service -p 8080:8080 fibonacci-service
          test "$(curl -sSf --retry 10 --retry-delay 1 --retry-all-errors 'http://localhost:8080/fibonacci?n=5')" = '[0,1,1,2,3]'
      - name: Image stops cleanly
        run: |
          docker stop service
          test "$(docker inspect -f '{{.State.ExitCode}}' service)" = 0
      - name: Image logs to stdout
        run: |
          docker logs service 2>/dev/null | grep -q '"msg":"listening"'
          docker logs service 2>/dev/null | grep -q '"msg":"shutting down"'
      - name: Image rejects a bad argument
        run: |
          code=0
          docker run --rm fibonacci-service foo || code=$?
          test "$code" = 2
